<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Outer Ring (Reduction & Progress Cycle) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="24"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="360" filter="url(#shadow)"/>
  
  <!-- Stylized Nicotex Gum Piece / Diamond Shield Shape -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <!-- Pill/Gum Shape with Calming Flow -->
    <rect x="186" y="186" width="140" height="140" rx="36" transform="rotate(45 256 256)" fill="url(#glow)" opacity="0.95"/>
    <!-- Inner Breath / Pause Wave -->
    <path d="M 216 256 C 236 230 276 230 296 256 C 276 282 236 282 216 256 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="10" fill="#0f172a"/>
  </g>
  
  <!-- Small sparkling accent dot -->
  <circle cx="366" cy="150" r="10" fill="#38bdf8"/>
</svg>
